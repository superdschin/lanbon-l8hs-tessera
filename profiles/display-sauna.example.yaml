# Example device profile for a Lanbon L8-HS three-relay screen.
# Copy to /config/esphome/display-sauna.yaml and adapt the local paths/secrets if needed.

substitutions:
  LANGUAGE: "de"
  FONT_DIR: "homeassistant_espscreen/fonts"
  DEVICE_NAME: "display-sauna"
  DEVICE_FRIENDLY_NAME: "Display Sauna"

external_components:
  - source:
      type: local
      path: homeassistant_espscreen/components
    components: [smart_display]

packages:
  core: !include homeassistant_espscreen/packages/core.yaml
  lanbon_board: !include homeassistant_espscreen/packages/boards/lanbon-l8hs.yaml

esphome:
  name: display-sauna
  friendly_name: Display Sauna

logger:

api:
  encryption:
    key: !secret api_encryption

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Display-Sauna"
    password: !secret fallback_ap_password

captive_portal:

# The board profile defines the ESP32 model and flash size. Keep the partition table
# used by your local ESPHome installation here if it is stored outside the board file.
esp32:
  board: esp32dev
  variant: esp32
  flash_size: 8MB
  partitions: /config/esphome/lanbon-8mb.csv
  framework:
    advanced:
      sram1_as_iram: true
