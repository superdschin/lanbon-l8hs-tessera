
substitutions:
  LANGUAGE: "de"
  FONT_DIR: "homeassistant_espscreen/fonts"
  DEVICE_NAME: "display-lanbon"
  DEVICE_FRIENDLY_NAME: "Display LanbonL8"

external_components:
  - source:
      type: local
      path: homeassistant_espscreen/components
    components: [smart_display]

packages:
  core: !include homeassistant_espscreen/packages/core.yaml
  lanbon_board: !include homeassistant_espscreen/packages/boards/lanbon-l8hs.yaml

esphome:
  name: display-lanbon
  friendly_name: Display Lanbon

logger:

api:
  encryption:
    key: !secret api_encryption

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Display-lanbon"
    password: "lanbon123"

captive_portal:

esp32:
  board: esp32dev
  variant: esp32
  flash_size: 8MB
  partitions: lanbon-8mb.csv
  framework:
    advanced:
      sram1_as_iram: true
